<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sound Deck">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Sound Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Sound Deck web app */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#17202b; --muted:#5a6573; --line:#d9dfe6;
  --accent:#1b6c86; --accent-soft:#e2f0f4;
  --vowel:#b4461f; --vowel-soft:#fbe9e1; --cons:#2d5fb8; --cons-soft:#e4ecfa;
  --again:#b3261e; --hard:#9a6a12; --good:#1d7a45; --easy:#1b6c86;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-word:"Noto Serif","Charis SIL","Times New Roman",serif;
  --font-ipa:var(--font-word);
  --skin:#f6e1d5; --cavity:#4a2f33;
  --lip:#e9b9a6; --flow:#1b6c86; --pin:#d9480f; --stage:#f7f8fa;
  --tongue:#e59aa5; --tongue-line:#b65766; --tissue:#f4dccd; --tissue-line:#8b6a5c; --tooth:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151b; --surface:#19212a; --ink:#e6ebf0; --muted:#9aa6b2; --line:#2b3541;
    --accent:#5fb6d1; --accent-soft:#163240;
    --vowel:#f08a62; --vowel-soft:#3a2219; --cons:#83a8f0; --cons-soft:#1c2a45;
    --again:#f2867f; --hard:#e7b75a; --good:#6fd39a; --easy:#5fb6d1;
      --skin:#3b2d29; --cavity:#1a0f12;
      --lip:#7a4b45; --flow:#5fb6d1; --pin:#ff8a4c; --stage:#141b22;
    --tongue:#c9707d; --tongue-line:#f0a3ae; --tissue:#3a2c27; --tissue-line:#c79f8c; --tooth:#e9edf1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#19212a; --ink:#e6ebf0; --muted:#9aa6b2; --line:#2b3541;
  --accent:#5fb6d1; --accent-soft:#163240;
  --vowel:#f08a62; --vowel-soft:#3a2219; --cons:#83a8f0; --cons-soft:#1c2a45;
  --again:#f2867f; --hard:#e7b75a; --good:#6fd39a; --easy:#5fb6d1;
      --skin:#3b2d29; --cavity:#1a0f12;
      --lip:#7a4b45; --flow:#5fb6d1; --pin:#ff8a4c; --stage:#141b22;
    --tongue:#c9707d; --tongue-line:#f0a3ae; --tissue:#3a2c27; --tissue-line:#c79f8c; --tooth:#e9edf1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{font-size:24px;margin:0 0 4px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:68ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13.5px;font-variant-numeric:tabular-nums}
.pill b{font-weight:700}
.btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:focus-visible,.grade button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cols{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:560px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.phone.anim{transition:transform .22s ease,opacity .22s ease}
.hint{text-align:center;font-size:12.5px;color:var(--muted)}
.cardtop{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cardtop .id{font-weight:700;color:var(--ink)}
.kind{font-size:12.5px;border-radius:999px;padding:1px 9px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.pic{aspect-ratio:4/3;max-width:100%;border-radius:14px;background:var(--bg);display:grid;place-items:center;position:relative}
.pic .emo{font-size:84px;line-height:1}
.pic .tag{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted)}
.prompt{text-align:center;color:var(--muted);font-size:14px}
.word{font-family:var(--font-word);font-size:44px;font-weight:700;text-align:center;letter-spacing:.01em;line-height:1.15}
.word .v{color:var(--vowel)} .word .c{color:var(--cons)} .word .hard{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.ipa{font-family:var(--font-word);text-align:center;font-size:20px}
.ipa small{display:block;font-family:var(--font-body);font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--font-word);font-size:14px;border-radius:999px;padding:2px 10px;border:1px solid transparent}
.chip.v{background:var(--vowel-soft);color:var(--vowel)} .chip.c{background:var(--cons-soft);color:var(--cons)}
.chip.hard{border-color:currentColor;font-weight:700}
table.ko{font-size:13px;width:100%}
table.ko td,table.ko th{white-space:normal;padding:4px 6px;vertical-align:middle}
table.ko td:first-child{width:72px}
.warn{font-size:13.5px;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.warn div+div{margin-top:2px}
.ex{font-size:14px;color:var(--muted);text-align:center}
.meaning{text-align:center}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{font:inherit;font-family:var(--font-word);font-size:24px;padding:18px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.choice button.ok{border-color:var(--good);color:var(--good)} .choice button.no{border-color:var(--again);color:var(--again)}
.play{align-self:center}
.spacer{flex:1}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade button{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 4px;min-height:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.grade button b{font-size:14px} .grade button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.grade .g0 b{color:var(--again)} .grade .g1 b{color:var(--hard)} .grade .g2 b{color:var(--good)} .grade .g3 b{color:var(--easy)}
.reveal{width:100%;padding:14px;border-radius:12px;font-size:15px}
.done{text-align:center;color:var(--muted);margin:auto 0}
.done b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h2{font-size:16px;margin:0 0 4px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12.5px}
tr.now td{background:var(--accent-soft)}
.st{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--bg)}
.st.LEARNING,.st.RELEARNING{color:var(--hard)} .st.REVIEW{color:var(--good)} .st.NEW{color:var(--muted)} .st.LOCKED{color:var(--muted);opacity:.7}
.log{margin-top:14px;font-size:13px;color:var(--muted);max-height:160px;overflow:auto}
.log div{padding:2px 0;border-bottom:1px dashed var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{font-style:normal;font-weight:700}
.views{display:block}
.view{display:none}.view.on{display:block;margin:0 auto}
.view.vf.on{max-width:62%}
.ctl.vsw{display:flex;justify-content:center;gap:0;margin:6px 0 2px}
.vsw button{border:1px solid var(--line,#ccc);background:transparent;color:inherit;padding:5px 14px;font-size:13px;cursor:pointer}
.vsw button:first-child{border-radius:8px 0 0 8px}.vsw button:last-child{border-radius:0 8px 8px 0;border-left:0}
.vsw button[aria-pressed=true]{background:var(--ink,#222);color:var(--bg,#fff)}
.view{text-align:center;font-size:11.5px;color:var(--muted)}
.view svg{width:100%;height:auto;display:block}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;margin-top:8px;padding:0 4px}
.ctl .steps,.ctl .plays{display:flex;flex-wrap:wrap;gap:6px}
.ctl button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.ctl .play[data-speed="normal"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ctl .play[data-speed="normal"][aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ctl button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
figure.stage .cap{font-size:13.5px;min-height:42px;padding:6px 6px 0;line-height:1.5}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vtop{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.vtop svg{width:120px;height:auto;background:var(--stage);border-radius:8px}
.vnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.vt{font-weight:700;font-size:15px;text-wrap:balance}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchips a{text-decoration:none;font-family:var(--font-ipa);font-size:14px}
.vd{margin:0;font-size:13.5px;color:var(--muted)}
.cmplinks{font-size:13px;color:var(--muted)}
.cmplinks a{color:var(--accent);font-weight:500;text-decoration:none}
.cmplinks a:hover{text-decoration:underline}
.cmpgrid{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
@media (max-width:440px){.cmpgrid{grid-template-columns:1fr}}
.card.flash{outline:3px solid var(--pin);outline-offset:2px}
figure.stage{margin:0;background:var(--stage);border-radius:10px;padding:6px 6px 8px}
figure.stage figcaption{display:flex;gap:8px;align-items:center;font-size:13.5px;min-height:40px;padding:0 6px}
figure.stage .cap{flex:1}
.pp{font:inherit;font-size:11px;width:28px;height:28px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}

.mouth{display:flex;flex-direction:column;gap:6px}
.mouth .pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.mouth .pick button{font:inherit;font-family:var(--font-word);font-size:14px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.mouth .pick button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.vid{font-size:13px}
.vid a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* app shell */
html,body{margin:0}
body{min-height:100dvh}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.top #dayDate{color:var(--muted)}
.topr{display:flex;gap:8px;align-items:center}
.icon{font:inherit;font-size:18px;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px}
.app .phone{flex:1;min-height:0}
.pic .big{font-size:20px;padding:16px 28px}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade2 button{font:inherit;font-size:16px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:14px 8px;cursor:pointer}
.grade2 .no{color:var(--again)} .grade2 .yes{color:var(--good)}
.ipa .v{color:var(--vowel)} .ipa .c{color:var(--cons)} .ipa .hard{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.done a.btn{text-decoration:none;display:inline-block}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);max-width:min(420px,calc(100vw - 32px));padding:18px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 10px;font-size:18px}
dialog label{display:flex;flex-direction:column;gap:6px;font-size:14px}
dialog input{font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
dialog .small{font-size:13px;color:var(--muted);margin:8px 0}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
</style>
</head>
<body>

<div class="app">
<header class="top">
  <div><b id="dayTitle">Sound Deck</b><span id="dayDate"></span></div>
  <div class="topr"><span class="pill" id="left"></span><button class="icon" id="openSet" type="button" aria-label="Settings">⚙︎</button></div>
</header>
<section class="phone" id="phone" aria-live="polite"></section>
<dialog id="set">
  <form method="dialog">
    <h2>Settings</h2>
    <label>Google Sheet link (Apps Script web app)
      <input id="sheetUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <p class="small" id="syncState"></p>
    <p class="small">Words you mark "Don't know" are saved on this phone and sent to the sheet. When the app opens it reads the list back from the sheet.</p>
    <div class="row"><button class="btn" type="button" id="syncNow">Sync now</button><button class="btn primary" value="ok">Done</button></div>
  </form>
</dialog>
</div>
<script src="sounds.js"></script>
<script src="words-a.js"></script>
<script src="words-b.js"></script>
<script src="words-c.js"></script>
<script src="app.js"></script>
</body>
</html>
